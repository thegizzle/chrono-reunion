<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronomètre de Réunion</title>
    <!-- Tailwind CSS pour le style rapide et mobile-first -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Emplacement pour le manifeste PWA généré dynamiquement -->
    <link id="manifest-link" rel="manifest" href="">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gris clair */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Styles personnalisés pour la barre de progression */
        .progress-bar-bg { background-color: #e5e7eb; }
        .progress-bar-fill { transition: width 0.5s ease, background-color 0.5s ease; }
        
        /* Effet d'enfoncement pour les boutons */
        button:active { transform: scale(0.95); }
    </style>
</head>
<body class="text-gray-800 pb-24">

    <!-- En-tête fixe avec Chronomètre Global -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50 transition-colors duration-500" id="global-header">
        <div class="max-w-3xl mx-auto px-4 py-3">
            <!-- Panneau Heure en direct et Fin prévisionnelle -->
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-200" id="live-time-panel">
                <div class="text-xs sm:text-sm font-semibold text-gray-600 flex items-center gap-1 sm:gap-2">
                    <span>🕒 Actuelle:</span>
                    <span id="live-clock" class="font-mono text-blue-600 font-bold text-sm sm:text-base">--:--:--</span>
                </div>
                <div class="text-xs sm:text-sm font-semibold text-gray-600 flex items-center gap-1 sm:gap-2">
                    <span>🏁 Fin prévue:</span>
                    <span id="estimated-end" class="font-mono text-purple-600 font-bold text-sm sm:text-base">--:--</span>
                </div>
            </div>

            <div class="flex justify-between items-end mb-2">
                <div>
                    <h1 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Temps Global</h1>
                    <div class="text-3xl font-bold font-mono" id="global-time">00:00</div>
                </div>
                <div class="text-right">
                    <span class="text-xs font-semibold text-gray-500 uppercase">Restant</span>
                    <div class="text-lg font-bold text-gray-700 font-mono" id="global-remaining">90:00</div>
                </div>
            </div>
            <!-- Barre de progression -->
            <div class="h-2 w-full progress-bar-bg rounded-full overflow-hidden">
                <div id="global-progress" class="h-full bg-gray-600 progress-bar-fill w-0"></div>
            </div>
        </div>
    </header>

    <!-- Espace pour l'en-tête fixe -->
    <div class="h-36"></div>

    <!-- Conteneur principal (Programme) -->
    <main class="max-w-3xl mx-auto px-2 sm:px-4 py-4" id="app-container">
        <!-- Les sections seront injectées ici par JavaScript -->
    </main>

    <script>
        // --- 1. DONNÉES DU PROGRAMME ---
        const meetingData = [
            { id: 1, section: '', title: "Cantique d'ouverture", targetMins: 5 },
            { id: 2, section: '', title: "Paroles d'Introduction", targetMins: 1 },
            { id: 3, section: 'JOYAUX DE LA PAROLE DE DIEU', title: "Sujet 1", targetMins: 10 },
            { id: 4, section: 'JOYAUX DE LA PAROLE DE DIEU', title: "Perles spirituelles", targetMins: 10 },
            { id: 5, section: 'JOYAUX DE LA PAROLE DE DIEU', title: "Lecture de la Bible", targetMins: 4 },
            { id: 6, section: 'APPLIQUE-TOI AU MINISTÈRE', title: "Sujet 1", targetMins: 3 },
            { id: 7, section: 'APPLIQUE-TOI AU MINISTÈRE', title: "Sujet 2", targetMins: 4 },
            { id: 8, section: 'APPLIQUE-TOI AU MINISTÈRE', title: "Sujet 3", targetMins: 5 },
            { id: 9, section: 'VIE CHRÉTIENNE', title: "Cantique", targetMins: 5 },
            { id: 10, section: 'VIE CHRÉTIENNE', title: "Sujet 1", targetMins: 15 },
            { id: 11, section: 'VIE CHRÉTIENNE', title: "Étude biblique de l'assemblée", targetMins: 30 },
            { id: 12, section: 'VIE CHRÉTIENNE', title: "Paroles de conclusion", targetMins: 3 },
            { id: 13, section: 'VIE CHRÉTIENNE', title: "Communications", targetMins: 0 },
            { id: 14, section: 'VIE CHRÉTIENNE', title: "Cantique final", targetMins: 5 }
        ];

        // Initialisation de l'état des chronomètres
        let timers = meetingData.map(item => ({
            ...item,
            elapsedSeconds: 0, // Temps écoulé en secondes
            accumulated: 0,    // Temps accumulé avant la dernière pause
            lastTickTime: 0,   // Timestamp du dernier lancement
            isRunning: false,
            isCompleted: false // Indique si la partie est validée/terminée
        }));

        const GLOBAL_LIMIT_SECONDS = 90 * 60; // 1h30 en secondes
        let animationFrameId;

        // --- 2. LOGIQUE DE CHRONOMÉTRAGE ---

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function playTimer(id) {
            const now = Date.now();
            timers.forEach(t => {
                if (t.id === id) {
                    if (!t.isRunning) {
                        t.isRunning = true;
                        t.lastTickTime = now;
                    }
                } else {
                    // Mettre en pause les autres
                    if (t.isRunning) {
                        t.accumulated += (now - t.lastTickTime) / 1000;
                        t.isRunning = false;
                        t.elapsedSeconds = t.accumulated;
                    }
                }
            });
            render();
            startLoop();
        }

        function pauseTimer(id) {
            const t = timers.find(x => x.id === id);
            if (t && t.isRunning) {
                const now = Date.now();
                t.accumulated += (now - t.lastTickTime) / 1000;
                t.isRunning = false;
                t.elapsedSeconds = t.accumulated;
            }
            render();
        }

        function completeTimer(id) {
            const t = timers.find(x => x.id === id);
            if (t) {
                if (t.isRunning) {
                    const now = Date.now();
                    t.accumulated += (now - t.lastTickTime) / 1000;
                    t.isRunning = false;
                    t.elapsedSeconds = t.accumulated;
                }
                t.isCompleted = true;
            }
            render();
        }

        function resetTimer(id) {
            const t = timers.find(x => x.id === id);
            if (t) {
                t.isRunning = false;
                t.isCompleted = false;
                t.accumulated = 0;
                t.elapsedSeconds = 0;
            }
            render();
        }

        function updateTick() {
            let active = false;
            const now = Date.now();
            
            timers.forEach(t => {
                if (t.isRunning) {
                    active = true;
                    t.elapsedSeconds = t.accumulated + (now - t.lastTickTime) / 1000;
                }
            });

            if (active) {
                updateUI();
                animationFrameId = requestAnimationFrame(updateTick);
            }
        }

        function startLoop() {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(updateTick);
        }

        // --- 3. LOGIQUE D'AFFICHAGE (UI) ---

        // Couleurs officielles des parties du programme
        function getSectionBg(section) {
            if (section === 'JOYAUX DE LA PAROLE DE DIEU') return 'bg-[#5b6770]'; // Gris-bleu ardoise
            if (section === 'APPLIQUE-TOI AU MINISTÈRE') return 'bg-[#c18626]'; // Moutarde / Or
            if (section === 'VIE CHRÉTIENNE') return 'bg-[#96313f]'; // Bordeaux
            return 'bg-gray-700'; // Défaut
        }

        function getSectionBorder(section) {
            if (section === 'JOYAUX DE LA PAROLE DE DIEU') return 'border-l-[#5b6770]';
            if (section === 'APPLIQUE-TOI AU MINISTÈRE') return 'border-l-[#c18626]';
            if (section === 'VIE CHRÉTIENNE') return 'border-l-[#96313f]';
            return 'border-l-gray-400';
        }

        // Créer les icônes SVG réutilisables
        const icons = {
            play: `<svg class="w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
            pause: `<svg class="w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`,
            reset: `<svg class="w-5 h-5 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>`,
            check: `<svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`
        };

        function render() {
            const container = document.getElementById('app-container');
            let html = '';
            let currentSection = null;

            timers.forEach((t, index) => {
                // Afficher l'en-tête de section s'il change et s'il n'est pas vide
                if (t.section && t.section !== currentSection) {
                    const bgClass = getSectionBg(t.section);
                    html += `
                        <div class="${bgClass} text-white font-bold px-3 py-2 mt-4 mb-2 rounded-md shadow-sm uppercase tracking-wider text-xs sm:text-sm">
                            ${t.section}
                        </div>
                    `;
                    currentSection = t.section;
                }

                const isOvertime = t.targetMins > 0 ? t.elapsedSeconds > (t.targetMins * 60) : false;
                // Le rouge devient prioritaire si le temps est dépassé
                let timerColor = isOvertime ? 'text-red-600' : (t.isRunning ? 'text-blue-600' : 'text-gray-800');
                if (t.isCompleted) timerColor = isOvertime ? 'text-red-800 opacity-70' : 'text-green-600 opacity-70';
                
                const rowBg = t.isCompleted ? 'bg-green-50' : (index % 2 === 0 ? 'bg-white' : 'bg-gray-50');
                const borderClass = getSectionBorder(t.section);
                const titleClass = t.isCompleted ? 'text-gray-500 line-through' : 'text-gray-800';

                html += `
                    <div class="${rowBg} border border-gray-200 border-l-4 ${borderClass} rounded-lg p-3 mb-2 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-colors">
                        <div class="flex-1">
                            <h2 class="text-sm sm:text-base font-semibold ${titleClass} leading-tight">${t.id}. ${t.title}</h2>
                        </div>
                        
                        <div class="flex items-center justify-between sm:justify-end gap-4 sm:gap-6">
                            <!-- Affichage du temps avec l'objectif à droite -->
                            <div class="flex items-baseline gap-1 text-right min-w-[120px] justify-end">
                                <div id="time-display-${t.id}" class="font-mono text-xl sm:text-2xl font-bold ${timerColor}">
                                    ${formatTime(t.elapsedSeconds)}
                                </div>
                                <div class="font-mono text-sm text-gray-500">
                                    ${t.targetMins > 0 ? '/ ' + formatTime(t.targetMins * 60) : ''}
                                </div>
                            </div>
                            
                            <!-- Contrôles -->
                            <div class="flex bg-gray-200 rounded-lg p-1 gap-1">
                                ${t.isCompleted ? 
                                    `<button onclick="resetTimer(${t.id})" class="p-2 bg-white rounded shadow-sm hover:bg-gray-50 transition-colors" aria-label="Reset">
                                        ${icons.reset}
                                    </button>` 
                                    :
                                    `
                                    ${!t.isRunning ? 
                                        `<button onclick="playTimer(${t.id})" class="p-2 bg-white rounded shadow-sm hover:bg-gray-50 transition-colors" aria-label="Play">
                                            ${icons.play}
                                        </button>` : 
                                        `<button onclick="pauseTimer(${t.id})" class="p-2 bg-yellow-400 rounded shadow-sm hover:bg-yellow-500 transition-colors" aria-label="Pause">
                                            ${icons.pause}
                                        </button>`
                                    }
                                    <button onclick="completeTimer(${t.id})" class="p-2 bg-green-400 rounded shadow-sm hover:bg-green-500 transition-colors" aria-label="Valider">
                                        ${icons.check}
                                    </button>
                                    <button onclick="resetTimer(${t.id})" class="p-2 bg-white rounded shadow-sm hover:bg-gray-50 transition-colors" aria-label="Reset">
                                        ${icons.reset}
                                    </button>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateGlobalUI(); // Mettre à jour les totaux globaux directement
        }

        function updateUI() {
            // Mise à jour performante (uniquement les textes) pendant que le chrono tourne
            timers.forEach(t => {
                const display = document.getElementById(`time-display-${t.id}`);
                if (display) {
                    display.textContent = formatTime(t.elapsedSeconds);
                    const isOvertime = t.targetMins > 0 ? t.elapsedSeconds > (t.targetMins * 60) : false;
                    
                    // Gestion des classes de couleur (rouge prioritaire si dépassement)
                    let colorClass = isOvertime ? 'text-red-600' : (t.isRunning ? 'text-blue-600' : 'text-gray-800');
                    if (t.isCompleted) {
                        colorClass = isOvertime ? 'text-red-800 opacity-70' : 'text-green-600 opacity-70';
                    }
                    
                    display.className = `font-mono text-xl sm:text-2xl font-bold ${colorClass}`;
                }
            });
            updateGlobalUI();
        }

        function updateGlobalUI() {
            const totalElapsed = timers.reduce((sum, t) => sum + t.elapsedSeconds, 0);
            
            const globalTimeEl = document.getElementById('global-time');
            globalTimeEl.textContent = formatTime(totalElapsed);

            // Calcul et affichage du temps restant
            const remainingSeconds = GLOBAL_LIMIT_SECONDS - totalElapsed;
            const remainingEl = document.getElementById('global-remaining');
            
            if (remainingSeconds >= 0) {
                remainingEl.textContent = formatTime(remainingSeconds);
            } else {
                remainingEl.textContent = "-" + formatTime(Math.abs(remainingSeconds));
            }

            // Gestion de la barre de progression
            const progressPercentage = Math.min((totalElapsed / GLOBAL_LIMIT_SECONDS) * 100, 100);
            const progressBar = document.getElementById('global-progress');
            progressBar.style.width = `${progressPercentage}%`;

            const header = document.getElementById('global-header');

            if (totalElapsed > GLOBAL_LIMIT_SECONDS) {
                // Alerte si temps dépassé
                globalTimeEl.classList.add('text-red-600');
                globalTimeEl.classList.remove('text-gray-800');
                remainingEl.classList.add('text-red-600');
                remainingEl.classList.remove('text-gray-700');
                progressBar.classList.add('bg-red-600');
                progressBar.classList.remove('bg-gray-600');
                header.classList.add('bg-red-50');
                header.classList.remove('bg-white');
            } else {
                globalTimeEl.classList.add('text-gray-800');
                globalTimeEl.classList.remove('text-red-600');
                remainingEl.classList.add('text-gray-700');
                remainingEl.classList.remove('text-red-600');
                progressBar.classList.add('bg-gray-600');
                progressBar.classList.remove('bg-red-600');
                header.classList.add('bg-white');
                header.classList.remove('bg-red-50');
            }
        }

        // --- 4. INTÉGRATION PWA (Dynamique pour fichier unique) ---
        
        // Icône SVG simple pour l'application
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" fill="#4b5563"/>
            <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="32"/>
            <path d="M256 120v140l90 90" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
        const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

        const manifest = {
            "name": "Chronomètre de Réunion",
            "short_name": "ChronoRéunion",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f3f4f6",
            "theme_color": "#ffffff",
            "icons": [
                {
                    "src": iconUrl,
                    "sizes": "192x192 512x512",
                    "type": "image/svg+xml",
                    "purpose": "any maskable"
                }
            ]
        };

        // Injection du manifeste
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        // --- 5. HEURE EN DIRECT ET FIN PRÉVISIONNELLE ---
        function updateLiveClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            const liveClockEl = document.getElementById('live-clock');
            if(liveClockEl) liveClockEl.textContent = `${hours}:${minutes}:${seconds}`;

            const estimatedEndEl = document.getElementById('estimated-end');

            // Vérifier si la réunion a commencé (au moins un chrono lancé ou validé)
            const hasStarted = timers.some(t => t.isRunning || t.elapsedSeconds > 0 || t.isCompleted);

            if (!hasStarted) {
                if(estimatedEndEl) estimatedEndEl.textContent = `--:--`;
                return; // On arrête le calcul ici si la réunion n'est pas commencée
            }

            // Calcul de la fin prévisionnelle
            let remainingPlannedSeconds = 0;
            timers.forEach(t => {
                if (!t.isCompleted) {
                    const targetSeconds = t.targetMins * 60;
                    if (t.elapsedSeconds > 0) {
                        // Si commencé, on ajoute le temps restant (minimum 0 si le temps est dépassé)
                        remainingPlannedSeconds += Math.max(0, targetSeconds - t.elapsedSeconds);
                    } else {
                        // Si pas commencé, on ajoute tout le temps prévu
                        remainingPlannedSeconds += targetSeconds;
                    }
                }
            });

            const endDate = new Date(now.getTime() + remainingPlannedSeconds * 1000);
            const endHours = endDate.getHours().toString().padStart(2, '0');
            const endMinutes = endDate.getMinutes().toString().padStart(2, '0');
            
            if(estimatedEndEl) estimatedEndEl.textContent = `${endHours}:${endMinutes}`;
        }

        // Mettre à jour l'horloge chaque seconde (indépendamment de l'état des chronos)
        setInterval(updateLiveClock, 1000);
        updateLiveClock(); // Appel immédiat

        // Démarrage initial
        render();

    </script>
</body>
</html>
